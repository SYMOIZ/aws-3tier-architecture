<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="AWS 3-tier architecture">
  <rect width="960" height="640" fill="#0b1220"/>
  <text x="480" y="42" text-anchor="middle" fill="#e8eefc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">INTERNET</text>
  <circle cx="480" cy="78" r="28" fill="#f5f7ff" stroke="#9db0ff" stroke-width="3"/>

  <!-- Public -->
  <rect x="60" y="130" width="840" height="220" rx="16" fill="#123524" stroke="#3ecf8e" stroke-width="3"/>
  <text x="80" y="158" fill="#7dffa8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">PUBLIC LAYER</text>

  <rect x="100" y="180" width="220" height="140" rx="12" fill="#c45c26"/>
  <text x="210" y="230" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Load Balancer</text>
  <text x="210" y="258" text-anchor="middle" fill="#ffe8d8" font-family="Segoe UI, Arial, sans-serif" font-size="14">ALB :80 · APP-SG</text>
  <text x="210" y="284" text-anchor="middle" fill="#ffe8d8" font-family="Segoe UI, Arial, sans-serif" font-size="13">users only</text>

  <rect x="370" y="180" width="220" height="140" rx="12" fill="#2b6cb0"/>
  <text x="480" y="230" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Squid</text>
  <text x="480" y="258" text-anchor="middle" fill="#d6e8ff" font-family="Segoe UI, Arial, sans-serif" font-size="14">:8888 · Proxy-SG</text>
  <text x="480" y="284" text-anchor="middle" fill="#d6e8ff" font-family="Segoe UI, Arial, sans-serif" font-size="13">outbound proxy</text>

  <rect x="640" y="180" width="220" height="140" rx="12" fill="#2b6cb0"/>
  <text x="750" y="230" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">OpenVPN</text>
  <text x="750" y="258" text-anchor="middle" fill="#d6e8ff" font-family="Segoe UI, Arial, sans-serif" font-size="14">:1194 · VPN-SG</text>
  <text x="750" y="284" text-anchor="middle" fill="#d6e8ff" font-family="Segoe UI, Arial, sans-serif" font-size="13">admin only</text>

  <!-- Private -->
  <rect x="160" y="400" width="640" height="190" rx="16" fill="#3a1520" stroke="#ff6b81" stroke-width="3"/>
  <text x="180" y="428" fill="#ffb3bf" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">PRIVATE LAYER</text>

  <rect x="220" y="460" width="220" height="100" rx="12" fill="#2b6cb0"/>
  <text x="330" y="505" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Frontend</text>
  <text x="330" y="530" text-anchor="middle" fill="#d6e8ff" font-family="Segoe UI, Arial, sans-serif" font-size="14">:80 · Web-SG · 10.0.11.10</text>

  <rect x="520" y="460" width="220" height="100" rx="12" fill="#2b6cb0"/>
  <text x="630" y="505" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Backend</text>
  <text x="630" y="530" text-anchor="middle" fill="#d6e8ff" font-family="Segoe UI, Arial, sans-serif" font-size="14">:8000 · Backend-SG · 10.0.11.20</text>

  <!-- Arrows Internet -> ALB / VPN -->
  <line x1="455" y1="106" x2="210" y2="180" stroke="#e8eefc" stroke-width="2"/>
  <line x1="505" y1="106" x2="750" y2="180" stroke="#e8eefc" stroke-width="2"/>

  <!-- ALB -> FE/BE -->
  <line x1="210" y1="320" x2="330" y2="460" stroke="#ffb080" stroke-width="2.5"/>
  <line x1="210" y1="320" x2="630" y2="460" stroke="#ffb080" stroke-width="2.5"/>

  <!-- VPN -> FE/BE dashed -->
  <line x1="750" y1="320" x2="330" y2="460" stroke="#9ec5ff" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="750" y1="320" x2="630" y2="460" stroke="#9ec5ff" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- FE/BE -> Squid -->
  <path d="M330 460 C330 380, 480 380, 480 320" fill="none" stroke="#7dffa8" stroke-width="2"/>
  <path d="M630 460 C630 380, 480 380, 480 320" fill="none" stroke="#7dffa8" stroke-width="2"/>

  <text x="300" y="370" fill="#ffb080" font-family="Segoe UI, Arial, sans-serif" font-size="12">HTTP</text>
  <text x="700" y="370" fill="#9ec5ff" font-family="Segoe UI, Arial, sans-serif" font-size="12">SSH via VPN</text>
  <text x="500" y="360" fill="#7dffa8" font-family="Segoe UI, Arial, sans-serif" font-size="12">proxy :8888</text>
</svg>
